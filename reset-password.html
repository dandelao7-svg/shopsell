<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset password — ShopSell</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@500;600;700;800&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a0f; --bg2:#13131a; --bg3:#1c1c27;
  --card:#16161e; --border:#24242f; --border2:#2f2f3d;
  --text:#e8e8f0; --text2:#b8b8c8; --muted:#60607a;
  --accent:#e63946; --accent-hover:#d32a37;
  --green:#00c896; --red:#e63946; --ups-gold:#ffb500; --radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text);
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem;
  background-image:radial-gradient(circle at 20% 30%, rgba(230,57,70,0.06), transparent 40%),
                   radial-gradient(circle at 80% 70%, rgba(255,181,0,0.04), transparent 40%);
}
.brand-wrap{position:absolute;top:2rem;left:2rem;display:flex;align-items:center;gap:10px;
  font-family:'Syne',sans-serif;font-size:18px;font-weight:700;letter-spacing:0.5px}
.brand-mark{width:32px;height:32px;background:linear-gradient(135deg, var(--accent), var(--ups-gold));
  border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:14px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:2.5rem;max-width:400px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,0.4)}
h1{font-family:'Syne',sans-serif;font-size:24px;font-weight:700;margin-bottom:6px}
.subtitle{font-size:13px;color:var(--muted);margin-bottom:1.5rem}
.field{margin-bottom:0.85rem}
.field label{display:block;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:5px}
.field input{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:7px;padding:9px 12px;
  font-family:'Outfit',sans-serif;font-size:13px;color:var(--text);outline:none;transition:border-color 0.15s}
.field input:focus{border-color:var(--accent)}
.pw-wrap{position:relative}
.pw-wrap input{padding-right:40px}
.pw-eye{position:absolute;top:50%;right:6px;transform:translateY(-50%);background:none;border:none;color:var(--muted);cursor:pointer;font-size:15px;line-height:1;padding:4px 6px;border-radius:5px}
.pw-eye:hover{color:var(--text2)}
.pw-reqs{list-style:none;margin:7px 0 0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:3px 12px}
.pw-reqs li{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:5px;transition:color 0.15s}
.pw-reqs li::before{content:'○';font-size:9px}
.pw-reqs li.met{color:var(--green)}
.pw-reqs li.met::before{content:'✓'}
button.submit{width:100%;background:var(--accent);color:#fff;border:none;border-radius:8px;padding:11px;
  font-family:'Outfit',sans-serif;font-size:14px;font-weight:600;cursor:pointer;margin-top:0.75rem;transition:background 0.15s}
button.submit:hover:not(:disabled){background:var(--accent-hover)}
button.submit:disabled{opacity:0.5;cursor:not-allowed}
.foot{text-align:center;margin-top:1.25rem;font-size:12px;color:var(--muted)}
.foot a{color:var(--accent);text-decoration:none}
.foot a:hover{text-decoration:underline}
.error{background:rgba(230,57,70,0.1);border:1px solid rgba(230,57,70,0.3);color:#ff7a8a;padding:10px 12px;border-radius:7px;font-size:12px;margin-bottom:1rem;display:none}
.error.show{display:block}
.ok{background:rgba(0,200,150,0.1);border:1px solid rgba(0,200,150,0.3);color:var(--green);padding:10px 12px;border-radius:7px;font-size:12px;margin-bottom:1rem;display:none}
.ok.show{display:block}
</style>
</head>
<body>

<div class="brand-wrap">
  <div class="brand-mark">S</div>
  <span>ShopSell</span>
</div>

<div class="card">
  <h1>Set a new password</h1>
  <div class="subtitle">Choose a new password for your account.</div>

  <div class="error" id="errorBox"></div>
  <div class="ok" id="okBox"></div>

  <form id="resetForm" onsubmit="return handleReset(event)">
    <div class="field">
      <label>New password</label>
      <div class="pw-wrap">
        <input type="password" id="password" required autocomplete="new-password" minlength="8" autofocus>
        <button type="button" class="pw-eye" onclick="togglePw('password', this)" aria-label="Show password" title="Show password">👁</button>
      </div>
      <ul class="pw-reqs" id="pwReqs">
        <li data-req="len">8+ characters</li>
        <li data-req="upper">1 uppercase letter</li>
        <li data-req="lower">1 lowercase letter</li>
        <li data-req="num">1 number</li>
        <li data-req="special">1 special character</li>
      </ul>
    </div>
    <div class="field">
      <label>Confirm password</label>
      <div class="pw-wrap">
        <input type="password" id="confirm" required autocomplete="new-password">
        <button type="button" class="pw-eye" onclick="togglePw('confirm', this)" aria-label="Show password" title="Show password">👁</button>
      </div>
    </div>
    <button type="submit" class="submit" id="submitBtn">Update password</button>
  </form>

  <div class="foot"><a href="/login">← Back to log in</a></div>
</div>

<script>
const token = new URLSearchParams(location.search).get('token');

function showError(msg){ const b=document.getElementById('errorBox'); b.textContent=msg; b.classList.add('show'); }
function clearError(){ document.getElementById('errorBox').classList.remove('show'); }

// ── Password strength: show/hide toggle + live requirements ──
function togglePw(id, btn){
  const inp = document.getElementById(id);
  const reveal = inp.type === 'password';
  inp.type = reveal ? 'text' : 'password';
  btn.textContent = reveal ? '🙈' : '👁';
  const label = reveal ? 'Hide password' : 'Show password';
  btn.setAttribute('aria-label', label); btn.setAttribute('title', label);
}
function pwChecks(pw){
  return {
    len: pw.length >= 8, upper: /[A-Z]/.test(pw), lower: /[a-z]/.test(pw),
    num: /[0-9]/.test(pw), special: /[^A-Za-z0-9]/.test(pw),
  };
}
function pwError(pw){
  const c = pwChecks(pw), missing = [];
  if(!c.len)     missing.push('at least 8 characters');
  if(!c.upper)   missing.push('an uppercase letter');
  if(!c.lower)   missing.push('a lowercase letter');
  if(!c.num)     missing.push('a number');
  if(!c.special) missing.push('a special character');
  return missing.length ? 'Password needs ' + missing.join(', ') + '.' : null;
}
function updatePwReqs(pw){
  const c = pwChecks(pw);
  document.querySelectorAll('#pwReqs li').forEach(li => li.classList.toggle('met', !!c[li.dataset.req]));
}
document.getElementById('password').addEventListener('input', e => updatePwReqs(e.target.value));

if(!token){
  showError('This reset link is missing its token. Request a new one from the login page.');
  document.getElementById('resetForm').style.display = 'none';
}

async function handleReset(e){
  e.preventDefault();
  clearError();
  const password = document.getElementById('password').value;
  const confirm  = document.getElementById('confirm').value;
  const pwProblem = pwError(password);
  if(pwProblem){ showError(pwProblem); return false; }
  if(password !== confirm){ showError('Passwords do not match.'); return false; }

  const btn = document.getElementById('submitBtn');
  btn.disabled = true; btn.textContent = 'Updating...';
  try {
    const res = await fetch('/api/auth/reset-password', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token, password }),
    });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || 'Could not reset password.');
    document.getElementById('resetForm').style.display = 'none';
    const ok = document.getElementById('okBox');
    ok.textContent = 'Password updated! Redirecting to log in…';
    ok.classList.add('show');
    setTimeout(() => { location.href = '/login'; }, 1800);
  } catch(err){
    showError(err.message);
    btn.disabled = false; btn.textContent = 'Update password';
  }
  return false;
}
</script>
</body>
</html>
