<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — ShopSell</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@500;600;700;800&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a0f; --bg2:#13131a; --bg3:#1c1c27;
  --card:#16161e; --border:#24242f; --border2:#2f2f3d;
  --text:#e8e8f0; --text2:#b8b8c8; --muted:#60607a;
  --accent:#e63946; --accent-hover:#d32a37;
  --green:#00c896; --red:#e63946;
  --ups-gold:#ffb500;
  --radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Outfit',sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:2rem;
  background-image:radial-gradient(circle at 20% 30%, rgba(230,57,70,0.06), transparent 40%),
                   radial-gradient(circle at 80% 70%, rgba(255,181,0,0.04), transparent 40%);
}
.brand-wrap{
  position:absolute;
  top:2rem;
  left:2rem;
  display:flex;
  align-items:center;
  gap:10px;
  font-family:'Syne',sans-serif;
  font-size:18px;
  font-weight:700;
  letter-spacing:0.5px;
}
.brand-mark{
  width:32px;height:32px;
  background:linear-gradient(135deg, var(--accent), var(--ups-gold));
  border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:800;font-size:14px;
}
.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:2.5rem;
  max-width:400px;
  width:100%;
  box-shadow:0 20px 60px rgba(0,0,0,0.4);
}
h1{
  font-family:'Syne',sans-serif;
  font-size:24px;
  font-weight:700;
  margin-bottom:6px;
}
.subtitle{
  font-size:13px;
  color:var(--muted);
  margin-bottom:1.5rem;
}
.field{
  margin-bottom:0.85rem;
}
.field label{
  display:block;
  font-size:11px;
  font-weight:600;
  color:var(--muted);
  text-transform:uppercase;
  letter-spacing:0.5px;
  margin-bottom:5px;
}
.field input{
  width:100%;
  background:var(--bg3);
  border:1px solid var(--border);
  border-radius:7px;
  padding:9px 12px;
  font-family:'Outfit',sans-serif;
  font-size:13px;
  color:var(--text);
  outline:none;
  transition:border-color 0.15s;
}
.field input:focus{ border-color:var(--accent); }
button.submit{
  width:100%;
  background:var(--accent);
  color:#fff;
  border:none;
  border-radius:8px;
  padding:11px;
  font-family:'Outfit',sans-serif;
  font-size:14px;
  font-weight:600;
  cursor:pointer;
  margin-top:0.75rem;
  transition:background 0.15s;
}
button.submit:hover:not(:disabled){background:var(--accent-hover)}
button.submit:disabled{opacity:0.5;cursor:not-allowed}
.foot{
  text-align:center;
  margin-top:1.25rem;
  font-size:12px;
  color:var(--muted);
}
.foot a{color:var(--accent);text-decoration:none}
.foot a:hover{text-decoration:underline}
.error{
  background:rgba(230,57,70,0.1);
  border:1px solid rgba(230,57,70,0.3);
  color:#ff7a8a;
  padding:10px 12px;
  border-radius:7px;
  font-size:12px;
  margin-bottom:1rem;
  display:none;
}
.error.show{display:block}
</style>
</head>
<body>

<div class="brand-wrap">
  <div class="brand-mark">S</div>
  <span>ShopSell</span>
</div>

<div class="card">
  <h1>Welcome back</h1>
  <div class="subtitle">Log in to manage your store</div>

  <div class="error" id="errorBox"></div>

  <form id="loginForm" onsubmit="return handleLogin(event)">
    <div class="field">
      <label>Email</label>
      <input type="email" id="email" required autocomplete="email" autofocus>
    </div>

    <div class="field">
      <label>Password</label>
      <input type="password" id="password" required autocomplete="current-password">
    </div>

    <button type="submit" class="submit" id="submitBtn">Log in →</button>
  </form>

  <div class="foot" style="margin-top:14px">
    <a href="#" id="forgotLink" onclick="showForgot(event)">Forgot your password?</a>
  </div>

  <!-- Forgot-password request form (hidden until the link is clicked) -->
  <form id="forgotForm" onsubmit="return handleForgot(event)" style="display:none;margin-top:8px">
    <div class="field">
      <label>Email</label>
      <input type="email" id="forgotEmail" autocomplete="email" placeholder="you@example.com">
    </div>
    <button type="submit" class="submit" id="forgotBtn">Send reset link</button>
    <div class="foot" style="margin-top:12px"><a href="#" onclick="showLogin(event)">← Back to log in</a></div>
  </form>
  <div class="foot" id="forgotSuccess" style="display:none;margin-top:8px;color:var(--green,#00a878)">
    If an account exists for that email, a reset link is on its way. Check your inbox.
  </div>

  <div class="foot">
    New here? <a href="/signup">Create an account</a>
  </div>
</div>

<script>
function showError(msg){
  const box = document.getElementById('errorBox');
  box.textContent = msg;
  box.classList.add('show');
}

function clearError(){
  document.getElementById('errorBox').classList.remove('show');
}

async function handleLogin(e){
  e.preventDefault();
  clearError();

  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = 'Logging in...';

  const payload = {
    email:    document.getElementById('email').value.trim().toLowerCase(),
    password: document.getElementById('password').value,
  };

  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    const data = await res.json();

    if(!res.ok){
      throw new Error(data.error || 'Login failed. Please try again.');
    }

    localStorage.setItem('ss_token', data.token);
    if(data.seller){
      localStorage.setItem('ss_seller', JSON.stringify(data.seller));
    }

    // After login, send them where they came from (if any) or dashboard
    const params = new URLSearchParams(window.location.search);
    const next   = params.get('next') || '/dashboard';
    window.location.href = next;

  } catch(err){
    showError(err.message);
    btn.disabled = false;
    btn.textContent = 'Log in →';
  }
  return false;
}

function showForgot(e){
  e.preventDefault();
  clearError();
  document.getElementById('loginForm').style.display = 'none';
  document.getElementById('forgotLink').parentElement.style.display = 'none';
  document.getElementById('forgotForm').style.display = 'block';
  // Prefill with whatever they typed in the login email field.
  document.getElementById('forgotEmail').value = document.getElementById('email').value.trim();
}
function showLogin(e){
  if(e) e.preventDefault();
  document.getElementById('forgotForm').style.display = 'none';
  document.getElementById('forgotSuccess').style.display = 'none';
  document.getElementById('loginForm').style.display = 'block';
  document.getElementById('forgotLink').parentElement.style.display = 'block';
}
async function handleForgot(e){
  e.preventDefault();
  clearError();
  const btn = document.getElementById('forgotBtn');
  const email = document.getElementById('forgotEmail').value.trim().toLowerCase();
  if(!email){ showError('Enter your email.'); return false; }
  btn.disabled = true; btn.textContent = 'Sending...';
  try {
    await fetch('/api/auth/forgot-password', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email }),
    });
    // Always show the generic success (server never reveals if the email exists).
    document.getElementById('forgotForm').style.display = 'none';
    document.getElementById('forgotSuccess').style.display = 'block';
  } catch(err){
    showError('Something went wrong. Please try again.');
    btn.disabled = false; btn.textContent = 'Send reset link';
  }
  return false;
}

// If user already logged in, redirect them
if(localStorage.getItem('ss_token')){
  fetch('/api/auth/me', {
    headers: { 'Authorization': 'Bearer ' + localStorage.getItem('ss_token') }
  }).then(r => {
    if(r.ok){
      const params = new URLSearchParams(window.location.search);
      window.location.href = params.get('next') || '/dashboard';
    }
  }).catch(() => {/* ignore */});
}
</script>
</body>
</html>
